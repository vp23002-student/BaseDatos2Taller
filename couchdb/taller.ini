; Configuración de Apache CouchDB para TallerSync
[couchdb]
single_node = true
max_document_size = 8000000

[chttpd]
; documentos de órdenes son pequeños; se permite lotes grandes de replicación
max_http_request_size = 67108864

[chttpd_auth]
; sesión de 8 horas (una jornada de taller)
timeout = 28800

[log]
level = warning

[cluster]
; un solo nodo: una réplica por shard
n = 1
q = 1
